[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixfmt" }

[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
auto-format = true
formatter = { command = "ruff", args = ["format", "--line-length", "88", "-"] }

[[langauge]]
name = "c"
auto-format = true
formatter = { command = "clang-format", args = ["--style={BasedOnStyle: Microsoft, PointerAlignment: Left, BreakBeforeBraces: Custom, BraceWrapping: {AfterNamespace: false}, Cpp11BracedListStyle: false, SpaceBeforeCpp11BracedList: true, AccessModifierOffset: -4}"] }

[[language]]
name = "cpp"
auto-format = true
formatter = { command = "clang-format", args = ["--style={BasedOnStyle: Microsoft, PointerAlignment: Left, BreakBeforeBraces: Custom, BraceWrapping: {AfterNamespace: false}, Cpp11BracedListStyle: false, SpaceBeforeCpp11BracedList: true, AccessModifierOffset: -4}"] }

[language-server]
ruff = { command = "ruff", args = ["server"] }
clangd = { command = "clangd", args = ["--header-insertion=never"] }
